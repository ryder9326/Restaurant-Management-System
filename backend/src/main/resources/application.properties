# ==============================================================================
# File cấu hình trung tâm (Master Configuration) của toàn bộ hệ thống Backend.
# - Kết nối tới CSDL MySQL thông qua HikariCP Connection Pool & Spring Data JPA.
# - Giữ nguyên chiến lược đặt tên vật lý (PhysicalNamingStrategyStandardImpl) để
#   khớp trực tiếp tên bảng/cột trong script SQL của báo cáo (banan, MaHD...).
# - Cung cấp tham số cấu hình cho CorsConfig (@Value app.cors.*), JwtTokenProvider
#   (@Value app.jwt.*), Flyway Migration và OpenApiConfig (Swagger UI).
# ==============================================================================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1
server.error.include-message=always
server.error.include-binding-errors=always

spring.application.name=restaurant-management

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurantdb?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=RestaurantHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.encoding=UTF-8

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# Bắt buộc truyền biến môi trường JWT_SECRET (tối thiểu 32 bytes Base64), không để giá trị mặc định cố định
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

logging.level.root=INFO
logging.level.com.restaurant.management=DEBUG
logging.level.org.hibernate.SQL=DEBUG